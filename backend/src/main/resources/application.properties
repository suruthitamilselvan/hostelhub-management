# Spring Boot Application Properties - HostelHub Backend
spring.application.name=HostelHub Backend
server.port=8080

# MySQL Database Configuration (Permanent Enterprise Database)
spring.datasource.url=jdbc:mysql://localhost:3306/hostelhub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=suruthi100208

# JPA / Hibernate Properties for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration
management.endpoints.web.exposure.include=*
